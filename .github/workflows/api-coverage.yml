name: API coverage

on:
  schedule:
    - cron: '0 22 * * 1'
  workflow_dispatch:
  # Only PRs that touch coverage run this, so a newly published endpoint can't turn unrelated PRs red.
  pull_request:
    paths:
      - 'src/api/endpoints/**'
      - 'src/api/client.rs'
      - 'api-coverage-ignore.txt'
      - 'scripts/api_coverage.py'
      - '.github/workflows/api-coverage.yml'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check coverage
        id: check
        run: |
          set +e
          python3 scripts/api_coverage.py > report.md
          code=$?
          set -e
          cat report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 2 means the check itself broke; fail without touching the issue.
          if [ "$code" -eq 2 ]; then exit 2; fi
          if [ "$code" -ne 0 ] && [ "${{ github.event_name }}" = "pull_request" ]; then exit 1; fi
          exit 0

      - name: Update tracking issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.check.outputs.code }}
          TITLE: CLI is missing customer API operations
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create api-coverage --color FBCA04 \
            --description "Customer API operations the CLI does not call" --force
          number=$(gh issue list --state open --label api-coverage --limit 100 \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ "$CODE" -eq 1 ]; then
            {
              echo "The weekly coverage check found operations in the [API reference](https://docs.plerion.com/api-reference) that no CLI command calls."
              echo
              cat report.md
              echo "Add a command for each, or list its operationId in \`api-coverage-ignore.txt\` with the reason it stays out of the CLI. This issue closes itself once nothing is missing."
              echo
              echo "Last checked: $RUN_URL"
            } > body.md
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file body.md
            else
              gh issue create --title "$TITLE" --label api-coverage --body-file body.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Every customer API operation is now called by the CLI or ignored. $RUN_URL"
          fi
