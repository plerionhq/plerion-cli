name: Release

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  old-verifier-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Select the affected verifier
        run: cargo update -p rustls-webpki --precise 0.103.15
      - name: Require the affected verifier to accept the captured chains
        env:
          EXPECT_OLD_VERIFIER_ACCEPTANCE: '1'
        run: cargo test --locked --test tls_trust_test -- --nocapture

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            artifact_name: plerion
            asset_name: plerion-linux-x86_64

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            artifact_name: plerion
            asset_name: plerion-linux-arm64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            artifact_name: plerion.exe
            asset_name: plerion-windows-x86_64.exe

          - target: x86_64-apple-darwin
            os: macos-15-intel
            use_cross: false
            artifact_name: plerion
            asset_name: plerion-macos-x86_64

          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            artifact_name: plerion
            asset_name: plerion-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        shell: bash

      - name: Verify locked TLS dependencies
        run: python scripts/check-tls-dependencies.py

      - name: Test
        run: cargo test --locked -- --nocapture

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Build native
        if: ${{ !matrix.use_cross }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Install ARM emulator
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Smoke test the release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.artifact_name }}
        run: |
          runner=()
          if [[ "$TARGET" == aarch64-unknown-linux-musl ]]; then
            runner=(qemu-aarch64)
          fi
          "${runner[@]}" "target/$TARGET/release/$BINARY" --version
          "${runner[@]}" "target/$TARGET/release/$BINARY" --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    needs: [build, old-verifier-control]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME:-v0.0.0}"
          # Rename each artifact to its directory name (the asset_name from the matrix)
          mkdir -p release-assets
          for dir in artifacts/*/; do
            asset_name=$(basename "$dir")
            # Find the binary inside (plerion or plerion.exe)
            for file in "$dir"*; do
              if [ -f "$file" ]; then
                cp "$file" "release-assets/${asset_name}"
                chmod +x "release-assets/${asset_name}"
              fi
            done
          done
          ls -la release-assets/
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
